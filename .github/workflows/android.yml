name: Build TeleVise

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Standalone APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleStandalone --stacktrace

      - name: Find APK
        run: |
          find TMessagesProj_AppStandalone -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleVise-APK
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
